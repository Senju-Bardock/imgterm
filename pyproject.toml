[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imgterm"
dynamic = ["version"]
description = "Display PNG, JPEG and animated GIF images in the terminal with no external dependencies (optional C engine for speed)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
imgterm = "imgterm:main"

[tool.setuptools.dynamic]
version = {attr = "imgterm.__version__"}

[tool.setuptools]
py-modules = ["imgterm"]
packages = ["imgterm_native"]

[tool.setuptools.package-data]
imgterm_native = ["*.c"]
